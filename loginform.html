<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4efe6;
            color: #26352b;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 420px;

            background: #fffdf8;
            padding: 40px;

            border-radius: 18px;
            border: 1px solid #ded6c8;

            box-shadow: 0 15px 35px rgba(58, 48, 35, 0.15);
        }

        .logo {
            width: 55px;
            height: 55px;

            background: #315c45;
            color: #f4efe6;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto 18px;

            font-size: 22px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #315c45;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .welcome {
            text-align: center;
            color: #81796d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #3b443d;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px;

            background: #f8f5ee;
            color: #26352b;

            border: 1px solid #d8d0c2;
            border-radius: 8px;

            font-size: 15px;
            margin-bottom: 20px;
        }

        input::placeholder {
            color: #aaa296;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #315c45;
            box-shadow: 0 0 0 3px rgba(49, 92, 69, 0.1);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 24px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #81796d;
        }

        .remember input {
            accent-color: #315c45;
        }

        .forgot {
            color: #b65c3a;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;

            background: #315c45;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #244735;
            transform: translateY(-2px);
            box-shadow: 0 7px 15px rgba(49, 92, 69, 0.2);
        }

        .signup {
            text-align: center;
            color: #81796d;
            font-size: 13px;
            margin-top: 25px;
        }

        .signup a {
            color: #b65c3a;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .small-line {
            width: 45px;
            height: 3px;
            background: #c98968;
            margin: 0 auto 25px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            L
        </div>

        <h1>Welcome Back</h1>

        <div class="small-line"></div>

        <p class="welcome">
            Login to continue to your account
        </p>

        <form>

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#" class="forgot">
                    Forgot Password?
                </a>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="#">Create Account</a>
        </p>

    </div>

</body>
</html>
