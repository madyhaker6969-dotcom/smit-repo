<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d1110;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 330px;
            padding: 20px;

            background: #171c1a;
            border: 1px solid #29332f;
            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .title {
            color: #dce7e2;
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .display {
            width: 100%;
            height: 80px;

            background: #0a0e0d;
            color: #e8fff5;

            border: 1px solid #29332f;
            border-radius: 12px;

            font-size: 32px;
            text-align: right;

            padding: 15px;
            margin-bottom: 18px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;

            border: none;
            border-radius: 12px;

            background: #242c29;
            color: #f1f5f3;

            font-size: 19px;
            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #303b36;
        }

        .operator {
            background: #285c48;
            color: #ffffff;
        }

        .operator:hover {
            background: #34745b;
        }

        .clear {
            background: #7b4038;
            color: white;
        }

        .clear:hover {
            background: #965047;
        }

        .equal {
            background: #79b89d;
            color: #0d1713;
            grid-row: span 2;
            height: 130px;
        }

        .equal:hover {
            background: #91ceb2;
        }

        .zero {
            grid-column: span 2;
        }

        .footer {
            text-align: center;
            color: #65736d;
            font-size: 11px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="title">Simple Calculator</div>

        <input type="text" class="display" id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteNumber()">⌫</button>
            <button class="operator" onclick="addNumber('%')">%</button>
            <button class="operator" onclick="addNumber('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="addNumber('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="addNumber('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="addNumber('+')">+</button>

            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addNumber('.')">.</button>

            <button class="equal" onclick="calculate()">=</button>

        </div>

        <div class="footer">
            HTML • CSS • JavaScript
        </div>

    </div>

    <script>

        let display = document.getElementById("display");

        function addNumber(number) {

            if (display.value === "0") {
                display.value = number;
            } else {
                display.value += number;
            }
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteNumber() {

            if (display.value.length === 1) {
                display.value = "0";
            } else {
                display.value = display.value.slice(0, -1);
            }
        }

        function calculate() {

            try {
                display.value = eval(display.value);
            } catch {
                display.value = "Error";
            }
        }

    </script>

</body>
</html>
