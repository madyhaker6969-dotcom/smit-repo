<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08070d;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact-box {
            width: 90%;
            max-width: 520px;

            background: #12101a;
            padding: 40px;

            border-radius: 18px;
            border: 1px solid #2b2540;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            color: #e5c76b;
            margin-bottom: 10px;
        }

        .line {
            width: 65px;
            height: 3px;
            background: #8b5cf6;
            margin: 0 auto 15px;
            border-radius: 5px;
        }

        .intro {
            text-align: center;
            color: #9994a8;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            color: #d8c98a;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;

            background: #0c0b11;
            color: white;

            border: 1px solid #302b3d;
            border-radius: 8px;

            font-size: 15px;
            margin-bottom: 20px;

            transition: 0.3s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #625e6d;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.15);
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 14px;

            background: #8b5cf6;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #a78bfa;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.25);
        }

        .footer {
            text-align: center;
            color: #55515f;
            font-size: 12px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

    <div class="contact-box">

        <h1>Contact Us</h1>

        <div class="line"></div>

        <p class="intro">
            Have a question or need some help?
            Send us a message and we'll get back to you.
        </p>

        <form>

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                placeholder="Enter subject"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                placeholder="Write your message..."
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

        <div class="footer">
            © 2026 Contact Form
        </div>

    </div>

</body>
</html>
