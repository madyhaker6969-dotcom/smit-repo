<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - My Neon Site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0d0d1a;
      color: #ffffff;
      line-height: 1.6;
    }

    header {
      background-color: #16162e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      border-bottom: 2px solid #00f3ff;
      box-shadow: 0 0 10px #00f3ff;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #00f3ff;
      text-shadow: 0 0 5px #00f3ff;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    nav a:hover, nav a.active {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff;
      text-align: center;
    }

    form {
      background-color: #16162e;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #00f3ff;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #b3b3cc;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background-color: #0d0d1a;
      border: 1px solid #333366;
      border-radius: 4px;
      color: #ffffff;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #ff007f;
      box-shadow: 0 0 5px #ff007f;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: transparent;
      color: #ff007f;
      border: 2px solid #ff007f;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 5px #ff007f;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #ff007f;
      color: #ffffff;
      box-shadow: 0 0 15px #ff007f;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">NeonSpace</div>
    <nav>
      <a href="navbar.html">Home</a>
      <a href="aboutnav.html">About</a>
      <a href="contactnav.html" class="active">Contact</a>
    </nav>
  </header>

  <div class="container">
    <h1>Contact Us</h1>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Your email">

      <label for="message">Message</label>
      <textarea id="message" rows="4" placeholder="Your message"></textarea>

      <button type="button">Send Message</button>
    </form>
  </div>

</body>
</html>
